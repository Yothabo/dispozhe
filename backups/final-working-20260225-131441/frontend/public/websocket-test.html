<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Manual Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0A192F; color: #E6F1FF; }
        button { padding: 8px 16px; margin: 4px; cursor: pointer; background: #233554; color: white; border: none; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .log { 
            background: #112240; 
            border: 1px solid #233554; 
            padding: 10px; 
            height: 300px; 
            overflow-y: auto;
            font-size: 12px;
            margin: 10px 0;
            font-family: monospace;
        }
        .success { color: #4ADE80; }
        .error { color: #F87171; }
    </style>
</head>
<body>
    <h1>WebSocket Manual Test</h1>
    
    <div>
        <button onclick="testStep1()">1. Create Session</button>
        <button onclick="testStep2()" id="step2" disabled>2. Connect User A</button>
        <button onclick="testStep3()" id="step3" disabled>3. Join User B</button>
        <button onclick="testStep4()" id="step4" disabled>4. Connect User B</button>
        <button onclick="testStep5()" id="step5" disabled>5. Send Message A to B</button>
        <button onclick="testStep6()" id="step6" disabled>6. Send Message B to A</button>
        <button onclick="testStep7()" id="step7" disabled>7. Terminate</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        const API_URL = 'http://localhost:8080';
        const WS_URL = 'ws://localhost:8080';
        
        let sessionId = null;
        let sessionCode = null;
        let wsA = null;
        let wsB = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testStep1() {
            log('Creating session...');
            try {
                const res = await fetch(`${API_URL}/session/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });
                const data = await res.json();
                sessionId = data.session_id;
                sessionCode = data.code;
                log(`Session created: ${sessionId}`, 'success');
                log(`Code: ${sessionCode}`);
                document.getElementById('step2').disabled = false;
            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }
        }

        function testStep2() {
            log('Connecting User A...');
            wsA = new WebSocket(`${WS_URL}/ws/${sessionId}`);
            
            wsA.onopen = () => {
                log('User A connected', 'success');
                document.getElementById('step3').disabled = false;
            };
            
            wsA.onmessage = (e) => {
                const data = JSON.parse(e.data);
                log(`User A received: ${data.type}`);
                if (data.type === 'connected') {
                    log(`Participants: ${data.connection_count}/2`);
                }
                if (data.type === 'message') {
                    const text = atob(data.data);
                    log(`User A message: ${text}`);
                }
            };
            
            wsA.onerror = () => log('User A error', 'error');
        }

        async function testStep3() {
            log('Joining User B...');
            try {
                const res = await fetch(`${API_URL}/session/code/${sessionCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                log(`User B joined: ${data.session_id}`, 'success');
                document.getElementById('step4').disabled = false;
            } catch (err) {
                log(`Join failed: ${err.message}`, 'error');
            }
        }

        function testStep4() {
            log('Connecting User B...');
            wsB = new WebSocket(`${WS_URL}/ws/${sessionId}`);
            
            wsB.onopen = () => {
                log('User B connected', 'success');
                document.getElementById('step5').disabled = false;
                document.getElementById('step6').disabled = false;
                document.getElementById('step7').disabled = false;
            };
            
            wsB.onmessage = (e) => {
                const data = JSON.parse(e.data);
                log(`User B received: ${data.type}`);
                if (data.type === 'message') {
                    const text = atob(data.data);
                    log(`User B message: ${text}`);
                }
            };
        }

        function testStep5() {
            const msg = 'Hello from A at ' + new Date().toLocaleTimeString();
            wsA.send(JSON.stringify({
                type: 'message',
                data: btoa(msg),
                timestamp: Date.now(),
                id: crypto.randomUUID()
            }));
            log(`User A sent: "${msg}"`);
        }

        function testStep6() {
            const msg = 'Hello from B at ' + new Date().toLocaleTimeString();
            wsB.send(JSON.stringify({
                type: 'message',
                data: btoa(msg),
                timestamp: Date.now(),
                id: crypto.randomUUID()
            }));
            log(`User B sent: "${msg}"`);
        }

        async function testStep7() {
            log('Terminating session...');
            try {
                await fetch(`${API_URL}/session/${sessionId}`, { method: 'DELETE' });
                log('Session terminated', 'success');
            } catch (err) {
                log(`Terminate failed: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
