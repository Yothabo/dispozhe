<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driflly · Full Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A192F;
            color: #E6F1FF;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #64FFDA;
            font-size: 20px;
        }
        .status {
            display: flex;
            gap: 15px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .online { background: #4ADE80; }
        .offline { background: #F87171; }
        .warning { background: #FBBF24; }
        
        .card {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            color: #64FFDA;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .waiting-screen {
            background: #0A192F;
            border: 1px solid #64FFDA;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .code-display {
            font-size: 32px;
            font-family: monospace;
            color: #64FFDA;
            letter-spacing: 8px;
            text-align: center;
            margin: 16px 0;
        }
        .share-box {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }
        .code-expired {
            color: #F87171;
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-waiting { background: #FBBF24; color: #0A192F; }
        .badge-active { background: #4ADE80; color: #0A192F; }
        .badge-expired { background: #F87171; color: white; }
        .badge-terminated { background: #F87171; color: white; }
        
        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #233554;
        }
        .row:last-child { border-bottom: none; }
        .label { color: #8892B0; font-size: 13px; }
        .value { color: #64FFDA; font-family: monospace; }
        
        .db-view {
            background: #0A192F;
            border: 1px solid #64FFDA;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
        }
        .db-row {
            display: grid;
            grid-template-columns: 100px 1fr 80px 80px;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #233554;
        }
        .db-header {
            color: #64FFDA;
            font-weight: 500;
        }
        
        button {
            background: #233554;
            color: #E6F1FF;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        button.primary {
            background: #64FFDA;
            color: #0A192F;
        }
        button.danger {
            background: #F87171;
            color: white;
        }
        button.small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }
        input {
            flex: 1;
            background: #0A192F;
            border: 1px solid #233554;
            color: #E6F1FF;
            padding: 10px;
            border-radius: 8px;
        }
        
        .message-area {
            background: #0A192F;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            margin: 12px 0;
            font-size: 12px;
        }
        .message {
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
        }
        .message.sent {
            background: #64FFDA;
            color: #0A192F;
            margin-left: auto;
        }
        .message.received {
            background: #233554;
        }
        
        .timer {
            font-family: monospace;
            font-size: 20px;
            color: #64FFDA;
            text-align: center;
        }
        
        .logs {
            background: #0A192F;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #112240;
            border-top: 1px solid #233554;
            display: flex;
            padding: 8px;
        }
        .nav-btn {
            flex: 1;
            background: none;
            color: #8892B0;
        }
        .nav-btn.active {
            color: #64FFDA;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Driflly · Database Monitor</h1>
        <div class="status">
            <span><span class="dot online" id="apiDot"></span> API</span>
            <span><span class="dot offline" id="dbDot"></span> DB</span>
        </div>
    </div>

    <!-- Database Status Card -->
    <div class="card">
        <div class="card-title">
            <span>🗄️ Database Sessions</span>
            <button class="small" onclick="refreshDB()">↻ Refresh</button>
        </div>
        <div id="dbContent" class="db-view">
            <div class="db-row db-header">
                <span>Session ID</span>
                <span>Status</span>
                <span>Code</span>
                <span>Expires</span>
            </div>
            <div id="dbRows">Loading...</div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="card" id="controlPanel" style="display: none;">
        <div class="card-title">
            <span>📋 Session Control</span>
            <span class="badge badge-waiting" id="sessionStatus">WAITING</span>
        </div>
        
        <div class="waiting-screen">
            <div class="code-display" id="codeDisplay">------</div>
            <div class="share-box" id="shareLink">-</div>
            <div class="flex" style="gap: 8px; margin: 12px 0;">
                <button class="small" onclick="copyCode()" id="copyCodeBtn">Copy Code</button>
                <button class="small" onclick="copyLink()" id="copyLinkBtn">Copy Link</button>
            </div>
            <div class="timer" id="timerDisplay">05:00</div>
            <button class="danger" onclick="terminateSession()" id="terminateBtn" style="width: 100%; margin-top: 12px;">End Session</button>
        </div>
    </div>

    <!-- Users -->
    <div class="card">
        <div class="card-title">
            <span>👤 User A · Initiator</span>
            <span class="badge badge-waiting" id="userAStatus">waiting</span>
        </div>
        <button class="primary" onclick="createSession()" id="createBtn" style="width: 100%;">Start New Chat</button>
        <div class="row" style="margin-top: 12px;">
            <span class="label">Session</span>
            <span class="value" id="userASession">-</span>
        </div>
        <div class="row">
            <span class="label">WebSocket</span>
            <span class="value" id="userAWS">disconnected</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>👤 User B · Joiner</span>
            <span class="badge badge-waiting" id="userBStatus">waiting</span>
        </div>
        <div class="input-group">
            <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">
            <button class="primary" onclick="joinWithCode()" id="joinBtn">Join</button>
        </div>
        <div class="row">
            <span class="label">Session</span>
            <span class="value" id="userBSession">-</span>
        </div>
        <div class="row">
            <span class="label">WebSocket</span>
            <span class="value" id="userBWS">disconnected</span>
        </div>
    </div>

    <!-- Chat -->
    <div class="card" id="chatPanel" style="display: none;">
        <div class="card-title">
            <span>💬 Chat</span>
            <span class="timer" id="chatTimer">05:00</span>
        </div>
        <div class="message-area" id="messages"></div>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Logs -->
    <div class="card">
        <div class="card-title">📋 Event Log</div>
        <div class="logs" id="logs"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showView('app')">📱 App</button>
        <button class="nav-btn" onclick="showView('db')">🗄️ Database</button>
        <button class="nav-btn" onclick="showView('logs')">📋 Logs</button>
    </div>

    <script>
        const host = window.location.hostname;
        const API_URL = `http://${host}:8080`;
        const WS_URL = `ws://${host}:8080`;

        // State
        let sessionId = null;
        let sessionCode = null;
        let encryptionKey = null;
        let wsA = null;
        let timerInterval = null;
        let timeLeft = 300;
        let logs = [];
        let pollInterval = null;
        let dbRefreshInterval = null;

        // Logging
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            logs.push({ time, message, type });
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logs');
            container.innerHTML = logs.map(l => 
                `<div>[${l.time}] ${l.message}</div>`
            ).join('');
            container.scrollTop = container.scrollHeight;
        }

        // Database Monitor
        async function refreshDB() {
            try {
                // Note: You'll need to add a backend endpoint for this
                // For now, we'll simulate by checking session status
                if (sessionId) {
                    const res = await fetch(`${API_URL}/session/${sessionId}/status`);
                    const data = await res.json();
                    
                    const dbRows = document.getElementById('dbRows');
                    const expires = new Date(data.expires_at).toLocaleTimeString();
                    const code = sessionCode || '-';
                    
                    dbRows.innerHTML = `
                        <div class="db-row">
                            <span>${sessionId}</span>
                            <span class="badge badge-${data.status}">${data.status}</span>
                            <span>${code}</span>
                            <span>${expires}</span>
                        </div>
                    `;
                    document.getElementById('dbDot').className = 'dot online';
                }
            } catch (err) {
                document.getElementById('dbRows').innerHTML = '<div>No active session</div>';
                document.getElementById('dbDot').className = 'dot offline';
            }
        }

        // Timer
        function startTimer() {
            timeLeft = 300;
            updateTimer();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    addLog('Chat duration ended');
                    checkCodeExpiry();
                }
            }, 1000);
        }

        function updateTimer() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = timeStr;
            document.getElementById('chatTimer').textContent = timeStr;
        }

        // Check if code expired (30 seconds after join)
        function checkCodeExpiry() {
            setTimeout(() => {
                document.getElementById('codeDisplay').classList.add('code-expired');
                document.getElementById('copyCodeBtn').disabled = true;
                addLog('Code expired (30s timeout)');
            }, 30000);
        }

        // User A: Create Session
        async function createSession() {
            addLog('User A: Creating session...');
            
            try {
                const keyArray = new Uint8Array(32);
                crypto.getRandomValues(keyArray);
                encryptionKey = btoa(String.fromCharCode(...keyArray));
                
                const res = await fetch(`${API_URL}/session/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });
                const data = await res.json();
                
                sessionId = data.session_id;
                sessionCode = data.code;
                
                document.getElementById('userASession').textContent = sessionId;
                document.getElementById('codeDisplay').textContent = sessionCode.match(/.{1,2}/g).join(' ');
                const shareLink = `${window.location.origin}/c/${sessionId}#${encryptionKey}`;
                document.getElementById('shareLink').textContent = shareLink;
                
                document.getElementById('controlPanel').style.display = 'block';
                document.getElementById('createBtn').disabled = true;
                document.getElementById('userAStatus').textContent = 'waiting';
                document.getElementById('userAStatus').className = 'badge badge-waiting';
                
                addLog(`User A: Session created ${sessionId}`);
                addLog(`Code: ${sessionCode}`);
                
                connectUserA();
                startPolling();
                refreshDB();
                
                // Code expires after 30 seconds if not used
                checkCodeExpiry();
                
            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
            }
        }

        // User A WebSocket
        function connectUserA() {
            if (!sessionId) return;
            
            addLog('User A: Connecting WebSocket...');
            wsA = new WebSocket(`${WS_URL}/ws/${sessionId}`);
            
            wsA.onopen = () => {
                addLog('User A: WebSocket connected');
                document.getElementById('userAWS').textContent = 'connected';
                document.getElementById('apiDot').className = 'dot online';
            };
            
            wsA.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'message') {
                    const text = atob(data.data);
                    document.getElementById('messages').innerHTML += `<div class="message received">B: ${text}</div>`;
                    addLog('User A: Message received');
                } else if (data.type === 'connected' && data.connection_count === 2) {
                    addLog('🎉 User B joined! Chat ready');
                    document.getElementById('chatPanel').style.display = 'block';
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('sessionStatus').textContent = 'ACTIVE';
                    document.getElementById('sessionStatus').className = 'badge badge-active';
                    document.getElementById('userAStatus').textContent = 'active';
                    document.getElementById('userAStatus').className = 'badge badge-active';
                    startTimer();
                    refreshDB();
                }
            };
            
            wsA.onclose = () => {
                addLog('User A: WebSocket disconnected');
                document.getElementById('userAWS').textContent = 'disconnected';
            };
        }

        // User B: Join
        async function joinWithCode() {
            const code = document.getElementById('codeInput').value;
            if (!code || code.length !== 6) {
                addLog('Please enter 6-digit code', 'error');
                return;
            }
            
            addLog(`User B: Joining with code ${code}`);
            
            try {
                const res = await fetch(`${API_URL}/session/code/${code}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                
                sessionId = data.session_id;
                encryptionKey = data.encryption_key;
                
                document.getElementById('userBSession').textContent = sessionId;
                document.getElementById('userBStatus').textContent = 'joined';
                document.getElementById('userBStatus').className = 'badge badge-active';
                
                addLog(`User B: Joined session ${sessionId}`);
                addLog('🔑 Code used - now expired');
                
                // Code is now expired (one-time use)
                document.getElementById('codeDisplay').classList.add('code-expired');
                document.getElementById('copyCodeBtn').disabled = true;
                document.getElementById('joinBtn').disabled = true;
                
                connectUserB();
                refreshDB();
                
            } catch (err) {
                addLog(`User B: Join failed - Code invalid or expired`, 'error');
            }
        }

        // User B WebSocket
        function connectUserB() {
            if (!sessionId) return;
            
            addLog('User B: Connecting WebSocket...');
            const wsB = new WebSocket(`${WS_URL}/ws/${sessionId}`);
            
            wsB.onopen = () => {
                addLog('User B: WebSocket connected');
                document.getElementById('userBWS').textContent = 'connected';
                document.getElementById('userBStatus').textContent = 'active';
                document.getElementById('userBStatus').className = 'badge badge-active';
            };
            
            wsB.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'message') {
                    const text = atob(data.data);
                    document.getElementById('messages').innerHTML += `<div class="message received">A: ${text}</div>`;
                    addLog('User B: Message received');
                }
            };
        }

        // Poll for joiner
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                if (!sessionId) {
                    clearInterval(pollInterval);
                    return;
                }
                
                try {
                    const res = await fetch(`${API_URL}/session/${sessionId}/status`);
                    const data = await res.json();
                    
                    if (data.status === 'active' && data.participant_count === 2) {
                        addLog('User B has joined!');
                        clearInterval(pollInterval);
                        refreshDB();
                    }
                    
                    // Update DB view
                    refreshDB();
                    
                } catch (err) {
                    // Session probably terminated
                }
            }, 2000);
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !wsA) return;
            
            const encrypted = btoa(text);
            wsA.send(JSON.stringify({
                type: 'message',
                data: encrypted,
                timestamp: Date.now(),
                id: crypto.randomUUID()
            }));
            
            document.getElementById('messages').innerHTML += `<div class="message sent">You: ${text}</div>`;
            input.value = '';
            addLog('Message sent');
        }

        // Copy functions
        function copyCode() {
            navigator.clipboard.writeText(sessionCode);
            addLog('Code copied');
        }

        function copyLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link);
            addLog('Link copied');
        }

        // Terminate Session
        async function terminateSession() {
            if (!sessionId) return;
            
            addLog('Terminating session...', 'warning');
            try {
                await fetch(`${API_URL}/session/${sessionId}`, { method: 'DELETE' });
                addLog('✅ Session deleted from database');
                
                if (wsA) wsA.close();
                if (timerInterval) clearInterval(timerInterval);
                if (pollInterval) clearInterval(pollInterval);
                
                document.getElementById('controlPanel').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'none';
                document.getElementById('createBtn').disabled = false;
                document.getElementById('joinBtn').disabled = false;
                document.getElementById('messages').innerHTML = '';
                document.getElementById('codeDisplay').classList.remove('code-expired');
                document.getElementById('copyCodeBtn').disabled = false;
                
                document.getElementById('userAStatus').textContent = 'waiting';
                document.getElementById('userAStatus').className = 'badge badge-waiting';
                document.getElementById('userBStatus').textContent = 'waiting';
                document.getElementById('userBStatus').className = 'badge badge-waiting';
                document.getElementById('sessionStatus').textContent = 'TERMINATED';
                document.getElementById('sessionStatus').className = 'badge badge-terminated';
                
                sessionId = null;
                refreshDB();
                
            } catch (err) {
                addLog(`Terminate failed: ${err.message}`, 'error');
            }
        }

        // Health Check
        async function checkHealth() {
            try {
                await fetch(`${API_URL}/health`);
                document.getElementById('apiDot').className = 'dot online';
            } catch {
                document.getElementById('apiDot').className = 'dot offline';
            }
        }

        // View Management
        window.showView = function(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        };

        // Initialize
        checkHealth();
        setInterval(checkHealth, 30000);
        refreshDB();
        setInterval(refreshDB, 5000);
        addLog('Database Monitor ready');
    </script>
</body>
</html>
