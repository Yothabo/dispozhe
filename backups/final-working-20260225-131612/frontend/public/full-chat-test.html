<!DOCTYPE html>
<html>
<head>
    <title>Driflly Complete Chat Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0A192F;
            color: #E6F1FF;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #64FFDA;
            margin-bottom: 20px;
            text-align: center;
        }
        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .user-panel {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 12px;
            padding: 20px;
        }
        .user-panel h2 {
            color: #64FFDA;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #233554;
        }
        .status {
            font-size: 12px;
            margin: 10px 0;
            padding: 10px;
            background: #0A192F;
            border-radius: 8px;
        }
        .connected { color: #4ADE80; }
        .disconnected { color: #ff6b6b; }
        button {
            background: #64FFDA;
            color: #0A192F;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .terminate-btn {
            background: #ff6b6b;
            color: white;
        }
        .message-area {
            background: #0A192F;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .message {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }
        .message.me {
            background: #64FFDA;
            color: #0A192F;
            margin-left: auto;
        }
        .message.them {
            background: #233554;
            color: #E6F1FF;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: #0A192F;
            border: 1px solid #233554;
            color: #E6F1FF;
            padding: 10px;
            border-radius: 6px;
        }
        .log-container {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .log {
            background: #0A192F;
            border: 1px solid #233554;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
        }
        .session-info {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 5px 10px;
            margin: 10px 0;
            font-size: 14px;
        }
        .label { color: #8892B0; }
        .value { color: #64FFDA; font-family: monospace; }
        .expired { color: #ff6b6b; font-weight: bold; }
        .message-count {
            font-size: 11px;
            color: #8892B0;
            margin-left: 5px;
        }
        .debug-badge {
            background: #233554;
            color: #64FFDA;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Driflly Complete Chat Test</h1>

        <div class="test-grid">
            <!-- User A Panel -->
            <div class="user-panel">
                <h2>
                    👤 User A (Initiator) 
                    <span id="msgCountA" class="message-count">0 msgs</span>
                    <span id="wsStateA" class="debug-badge">🔴 Disconnected</span>
                </h2>
                
                <div class="session-info">
                    <span class="label">Session ID:</span>
                    <span class="value" id="sessionId">-</span>
                    <span class="label">Code:</span>
                    <span class="value" id="accessCode">-</span>
                    <span class="label">Status:</span>
                    <span class="value" id="sessionStatus">-</span>
                    <span class="label">Time Left:</span>
                    <span class="value" id="timeLeft">-</span>
                </div>

                <div class="controls">
                    <button onclick="step1CreateSession()" id="btnCreate">1. Create Session</button>
                    <button onclick="step2ConnectA()" id="btnConnectA" disabled>2. Connect WebSocket</button>
                    <button onclick="terminateSession()" id="btnTerminate" class="terminate-btn" disabled>🗑️ Terminate</button>
                    <button onclick="checkSessionStatus()" id="btnCheckStatus">🔄 Check Status</button>
                    <button onclick="testWebSocketA()" id="btnTestA" disabled>📤 Test Send</button>
                </div>

                <div class="status" id="statusA">Ready to create session...</div>

                <div class="message-area" id="messagesA"></div>

                <div class="input-group">
                    <input type="text" id="messageA" placeholder="Type a message..." disabled>
                    <button onclick="sendMessageA()" id="btnSendA" disabled>Send</button>
                </div>
            </div>

            <!-- User B Panel -->
            <div class="user-panel">
                <h2>
                    👤 User B (Joiner) 
                    <span id="msgCountB" class="message-count">0 msgs</span>
                    <span id="wsStateB" class="debug-badge">🔴 Disconnected</span>
                </h2>
                
                <div class="session-info">
                    <span class="label">Session ID:</span>
                    <span class="value" id="sessionIdB">-</span>
                    <span class="label">Code:</span>
                    <span class="value" id="codeDisplay">-</span>
                    <span class="label">Time Left:</span>
                    <span class="value" id="timeLeftB">-</span>
                </div>

                <div class="controls">
                    <button onclick="step1JoinWithCode()" id="btnJoin" disabled>1. Join with Code</button>
                    <button onclick="step2ConnectB()" id="btnConnectB" disabled>2. Connect WebSocket</button>
                    <button onclick="testWebSocketB()" id="btnTestB" disabled>📤 Test Send</button>
                </div>

                <div class="status" id="statusB">Waiting for session creation...</div>

                <div class="message-area" id="messagesB"></div>

                <div class="input-group">
                    <input type="text" id="messageB" placeholder="Type a message..." disabled>
                    <button onclick="sendMessageB()" id="btnSendB" disabled>Send</button>
                </div>
            </div>
        </div>

        <!-- System Logs -->
        <div class="log-container">
            <h3 style="color: #64FFDA; margin-bottom: 10px;">📋 System Logs</h3>
            <div id="systemLogs" class="log"></div>
            <div style="margin-top: 10px;">
                <button onclick="copyLogs()" class="copy-btn">📋 Copy Logs</button>
                <button onclick="clearLogs()" class="copy-btn">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://10.123.43.207:8080';
        const WS_URL = 'ws://10.123.43.207:8080';
        
        let sessionId = null;
        let sessionCode = null;
        let userAKey = null;
        let wsA = null;
        let wsB = null;
        let statusInterval = null;
        let messageHistory = [];
        let msgCountA = 0;
        let msgCountB = 0;
        let bothConnectedLogged = false;
        let expiredLogged = false;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            
            const logDiv = document.getElementById('systemLogs');
            const entry = document.createElement('div');
            entry.style.color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#4ADE80' : '#64FFDA';
            entry.textContent = logEntry;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            messageHistory.push({ timestamp, message, type });
            console.log(`[${type}] ${message}`);
        }

        function updateWSState(user, state) {
            const el = document.getElementById(`wsState${user}`);
            if (state === 'connected') {
                el.innerHTML = '🟢 Connected';
                el.style.color = '#4ADE80';
            } else if (state === 'connecting') {
                el.innerHTML = '🟡 Connecting';
                el.style.color = '#feca57';
            } else {
                el.innerHTML = '🔴 Disconnected';
                el.style.color = '#ff6b6b';
            }
        }

        function copyLogs() {
            const logText = messageHistory.map(m => `[${m.timestamp}] ${m.message}`).join('\n');
            navigator.clipboard.writeText(logText).then(() => {
                log('✅ Logs copied to clipboard', 'success');
            }).catch(err => {
                log('❌ Failed to copy logs', 'error');
            });
        }

        function clearLogs() {
            document.getElementById('systemLogs').innerHTML = '';
            messageHistory = [];
            log('Logs cleared', 'info');
        }

        function updateMsgCount() {
            document.getElementById('msgCountA').textContent = `${msgCountA} msgs`;
            document.getElementById('msgCountB').textContent = `${msgCountB} msgs`;
        }

        function addMessage(user, text, sender) {
            const container = document.getElementById(`messages${user}`);
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'A' ? 'me' : 'them'}`;
            msgDiv.textContent = `${sender === 'A' ? '👤 A' : '👤 B'}: ${text}`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            
            if (user === 'A') {
                msgCountA++;
            } else {
                msgCountB++;
            }
            updateMsgCount();
            
            log(`📨 Message from User ${sender}: "${text}"`, 'success');
        }

        // Test WebSocket connection by sending a test message
        function testWebSocketA() {
            if (wsA && wsA.readyState === WebSocket.OPEN) {
                const testMsg = JSON.stringify({
                    type: 'test',
                    message: 'Test from A',
                    timestamp: Date.now()
                });
                wsA.send(testMsg);
                log('📤 Sent test message from A', 'info');
            } else {
                log('❌ WebSocket A not connected', 'error');
            }
        }

        function testWebSocketB() {
            if (wsB && wsB.readyState === WebSocket.OPEN) {
                const testMsg = JSON.stringify({
                    type: 'test',
                    message: 'Test from B',
                    timestamp: Date.now()
                });
                wsB.send(testMsg);
                log('📤 Sent test message from B', 'info');
            } else {
                log('❌ WebSocket B not connected', 'error');
            }
        }

        // Step 1A: Create Session
        async function step1CreateSession() {
            log('Creating session...', 'info');
            bothConnectedLogged = false;
            expiredLogged = false;
            msgCountA = 0;
            msgCountB = 0;
            updateMsgCount();

            try {
                const array = new Uint32Array(8);
                crypto.getRandomValues(array);
                userAKey = btoa(String.fromCharCode(...new Uint8Array(array.buffer)));
                
                const response = await fetch(`${API_URL}/session/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                sessionId = data.session_id;
                sessionCode = data.code;

                document.getElementById('sessionId').textContent = sessionId;
                document.getElementById('accessCode').textContent = sessionCode;
                document.getElementById('codeDisplay').textContent = sessionCode;
                document.getElementById('sessionStatus').textContent = data.status;
                document.getElementById('sessionStatus').className = 'value';

                log(`✅ Session created: ${sessionId}`, 'success');
                log(`🔑 Code: ${sessionCode}`, 'info');

                document.getElementById('btnJoin').disabled = false;
                document.getElementById('btnConnectA').disabled = false;
                document.getElementById('btnTerminate').disabled = false;
                
                startStatusPolling();

            } catch (error) {
                log(`❌ Failed to create session: ${error.message}`, 'error');
            }
        }

        // Step 1B: Join with Code
        async function step1JoinWithCode() {
            if (!sessionCode) {
                log('❌ No session code available', 'error');
                return;
            }

            log(`Joining with code: ${sessionCode}...`, 'info');

            try {
                const response = await fetch(`${API_URL}/session/code/${sessionCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                document.getElementById('sessionIdB').textContent = data.session_id;
                
                log(`✅ Joined session: ${data.session_id}`, 'success');

                document.getElementById('btnConnectB').disabled = false;

            } catch (error) {
                log(`❌ Failed to join: ${error.message}`, 'error');
            }
        }

        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);
            
            statusInterval = setInterval(async () => {
                if (!sessionId) return;
                
                try {
                    const response = await fetch(`${API_URL}/session/${sessionId}/status`);
                    if (!response.ok) {
                        if (response.status === 404) {
                            log('⚠️ Session no longer exists', 'warning');
                            clearInterval(statusInterval);
                        }
                        return;
                    }
                    
                    const data = await response.json();
                    
                    document.getElementById('sessionStatus').textContent = data.status;
                    
                    const mins = Math.floor(data.time_left_seconds / 60);
                    const secs = data.time_left_seconds % 60;
                    const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
                    document.getElementById('timeLeft').textContent = timeStr;
                    document.getElementById('timeLeftB').textContent = timeStr;
                    
                    if (data.status === 'active' && data.participant_count === 2 && !bothConnectedLogged) {
                        log('🎉 Both participants are now connected!', 'success');
                        bothConnectedLogged = true;
                    }
                    
                    if (data.status === 'expired' && !expiredLogged) {
                        log('🔚 Session expired', 'warning');
                        expiredLogged = true;
                        document.getElementById('sessionStatus').className = 'value expired';
                        document.getElementById('btnTerminate').disabled = true;
                        clearInterval(statusInterval);
                    }
                } catch (error) {
                    // Ignore polling errors
                }
            }, 2000);
        }

        // Connect User A WebSocket
        function step2ConnectA() {
            if (!sessionId) {
                log('❌ No session to connect to', 'error');
                return;
            }

            log('Connecting User A WebSocket...', 'info');
            updateWSState('A', 'connecting');

            const wsUrl = `${WS_URL}/ws/${sessionId}`;
            wsA = new WebSocket(wsUrl);

            wsA.onopen = () => {
                log('✅ User A WebSocket connected', 'success');
                updateWSState('A', 'connected');
                document.getElementById('btnConnectA').disabled = true;
                document.getElementById('messageA').disabled = false;
                document.getElementById('btnSendA').disabled = false;
                document.getElementById('btnTestA').disabled = false;
            };

            wsA.onmessage = (event) => {
                log(`📩 User A received: ${event.data.substring(0, 100)}`, 'info');
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'connected') {
                        log(`👥 User A: ${data.connection_count}/2 participants`, 'info');
                    } else if (data.type === 'message') {
                        try {
                            const decoded = atob(data.data);
                            addMessage('A', decoded, 'B');
                        } catch (e) {
                            addMessage('A', '[Encrypted Message]', 'B');
                        }
                    } else if (data.type === 'time_update') {
                        // Already handled by status polling
                    } else if (data.type === 'session_expired') {
                        log('⚠️ Session expired message received', 'warning');
                    }
                } catch (e) {
                    log(`❌ Failed to parse message: ${e.message}`, 'error');
                }
            };

            wsA.onerror = (error) => {
                log('❌ User A WebSocket error', 'error');
                updateWSState('A', 'disconnected');
            };

            wsA.onclose = () => {
                log('User A WebSocket closed', 'info');
                updateWSState('A', 'disconnected');
                document.getElementById('btnConnectA').disabled = false;
            };
        }

        // Connect User B WebSocket
        function step2ConnectB() {
            if (!sessionId) {
                log('❌ No session to connect to', 'error');
                return;
            }

            log('Connecting User B WebSocket...', 'info');
            updateWSState('B', 'connecting');

            const wsUrl = `${WS_URL}/ws/${sessionId}`;
            wsB = new WebSocket(wsUrl);

            wsB.onopen = () => {
                log('✅ User B WebSocket connected', 'success');
                updateWSState('B', 'connected');
                document.getElementById('btnConnectB').disabled = true;
                document.getElementById('messageB').disabled = false;
                document.getElementById('btnSendB').disabled = false;
                document.getElementById('btnTestB').disabled = false;
            };

            wsB.onmessage = (event) => {
                log(`📩 User B received: ${event.data.substring(0, 100)}`, 'info');
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'connected') {
                        log(`👥 User B: ${data.connection_count}/2 participants`, 'info');
                    } else if (data.type === 'message') {
                        try {
                            const decoded = atob(data.data);
                            addMessage('B', decoded, 'A');
                        } catch (e) {
                            addMessage('B', '[Encrypted Message]', 'A');
                        }
                    }
                } catch (e) {
                    log(`❌ Failed to parse message: ${e.message}`, 'error');
                }
            };

            wsB.onerror = (error) => {
                log('❌ User B WebSocket error', 'error');
                updateWSState('B', 'disconnected');
            };

            wsB.onclose = () => {
                log('User B WebSocket closed', 'info');
                updateWSState('B', 'disconnected');
                document.getElementById('btnConnectB').disabled = false;
            };
        }

        // Send message as User A
        function sendMessageA() {
            const input = document.getElementById('messageA');
            const text = input.value.trim();
            
            if (!text) return;
            
            if (!wsA || wsA.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket A not connected', 'error');
                return;
            }

            const id = crypto.randomUUID();
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const encrypted = btoa(String.fromCharCode(...new Uint8Array(data)));

            const message = {
                type: 'message',
                data: encrypted,
                timestamp: Date.now(),
                id: id
            };

            wsA.send(JSON.stringify(message));
            log(`📤 User A sent message: "${text}"`, 'success');
            addMessage('A', text, 'A');
            input.value = '';
        }

        // Send message as User B
        function sendMessageB() {
            const input = document.getElementById('messageB');
            const text = input.value.trim();
            
            if (!text) return;
            
            if (!wsB || wsB.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket B not connected', 'error');
                return;
            }

            const id = crypto.randomUUID();
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const encrypted = btoa(String.fromCharCode(...new Uint8Array(data)));

            const message = {
                type: 'message',
                data: encrypted,
                timestamp: Date.now(),
                id: id
            };

            wsB.send(JSON.stringify(message));
            log(`📤 User B sent message: "${text}"`, 'success');
            addMessage('B', text, 'B');
            input.value = '';
        }

        // Check session status
        async function checkSessionStatus() {
            if (!sessionId) {
                log('❌ No active session', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/session/${sessionId}/status`);
                if (!response.ok) {
                    if (response.status === 404) {
                        log('❌ Session not found', 'error');
                    }
                    return;
                }
                
                const data = await response.json();
                log(`📊 Status: ${data.status}, Participants: ${data.participant_count}/2`, 'info');
                
            } catch (error) {
                log(`❌ Status check failed: ${error.message}`, 'error');
            }
        }

        // Terminate session
        async function terminateSession() {
            if (!sessionId) {
                log('❌ No session to terminate', 'error');
                return;
            }

            log('🗑️ Terminating session...', 'warning');
            
            try {
                const response = await fetch(`${API_URL}/session/${sessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                log(`✅ Session terminated: ${JSON.stringify(data)}`, 'success');
                
                document.getElementById('sessionStatus').textContent = 'TERMINATED';
                document.getElementById('sessionStatus').className = 'value expired';
                document.getElementById('btnTerminate').disabled = true;
                
                if (wsA && wsA.readyState === WebSocket.OPEN) wsA.close();
                if (wsB && wsB.readyState === WebSocket.OPEN) wsB.close();
                
            } catch (error) {
                log(`❌ Failed to terminate: ${error.message}`, 'error');
            }
        }

        // Initial health check
        fetch(`${API_URL}/health`)
            .then(res => res.json())
            .then(data => log(`✅ Backend healthy: ${JSON.stringify(data)}`, 'success'))
            .catch(err => log(`❌ Backend unreachable: ${err.message}`, 'error'));
    </script>
</body>
</html>
