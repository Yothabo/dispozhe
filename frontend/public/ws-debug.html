<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Debugger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: monospace;
            background: #0A192F;
            color: #E6F1FF;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2 { color: #64FFDA; }
        .section {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #64FFDA;
            color: #0A192F;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        input {
            background: #0A192F;
            border: 1px solid #233554;
            color: #E6F1FF;
            padding: 10px;
            border-radius: 5px;
            width: 300px;
            font-family: monospace;
        }
        .log {
            background: #0A192F;
            border: 1px solid #233554;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            margin: 10px 0;
        }
        .error { color: #ff6b6b; }
        .success { color: #4ADE80; }
        .info { color: #64FFDA; }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px;
            font-weight: bold;
        }
        .connected { background: #4ADE80; color: #0A192F; }
        .disconnected { background: #ff6b6b; color: white; }
        .connecting { background: #feca57; color: #0A192F; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 WebSocket Debugger</h1>
        
        <div class="section">
            <h2>Step 1: Create Session</h2>
            <button onclick="createSession()">Create Test Session</button>
            <div id="sessionInfo" style="margin-top: 10px;">
                Session ID: <span id="sessionId">-</span><br>
                Code: <span id="code">-</span><br>
                Status: <span id="sessionStatus">-</span>
            </div>
        </div>

        <div class="section">
            <h2>Step 2: Join Session (as second user)</h2>
            <button onclick="joinSession()" id="joinBtn" disabled>Join Session</button>
            <div id="joinResult" style="margin-top: 10px;"></div>
        </div>

        <div class="section">
            <h2>Step 3: WebSocket Test</h2>
            <div>
                <span id="wsStatus" class="status-badge disconnected">Disconnected</span>
            </div>
            <div style="margin: 10px 0;">
                <button onclick="connectWebSocket()" id="connectBtn" disabled>Connect WebSocket</button>
                <button onclick="closeWebSocket()" id="closeBtn" disabled>Close</button>
            </div>
            <div>
                <input type="text" id="wsUrl" readonly style="width: 100%; margin: 10px 0;">
            </div>
        </div>

        <div class="section">
            <h2>Connection Logs</h2>
            <div id="log" class="log"></div>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>
    </div>

    <script>
        let ws = null;
        let currentSessionId = null;
        let sessionCode = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStatus(status) {
            const statusEl = document.getElementById('wsStatus');
            statusEl.className = `status-badge ${status}`;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        async function createSession() {
            log('Creating session...', 'info');
            
            try {
                const response = await fetch('http://10.98.52.229:8080/session/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                currentSessionId = data.session_id;
                sessionCode = data.code;
                
                document.getElementById('sessionId').textContent = data.session_id;
                document.getElementById('code').textContent = data.code || 'None';
                document.getElementById('sessionStatus').textContent = data.status;
                
                document.getElementById('joinBtn').disabled = false;
                
                log(`✅ Session created: ${data.session_id}`, 'success');
                log(`🔑 Code: ${data.code}`, 'info');
                log(`📊 Status: ${data.status}`, 'info');
                
                // Check status every 2 seconds
                startStatusPolling(data.session_id);
                
            } catch (error) {
                log(`❌ Failed to create session: ${error.message}`, 'error');
            }
        }

        function startStatusPolling(sessionId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`http://10.98.52.229:8080/session/${sessionId}/status`);
                    const data = await response.json();
                    document.getElementById('sessionStatus').textContent = data.status;
                    
                    if (data.status === 'active' && data.participant_count === 2) {
                        log('🎉 Session is now ACTIVE with 2 participants!', 'success');
                        document.getElementById('connectBtn').disabled = false;
                        clearInterval(interval);
                    }
                } catch (error) {
                    log(`❌ Status poll error: ${error.message}`, 'error');
                }
            }, 2000);
        }

        async function joinSession() {
            if (!sessionCode) {
                log('❌ No session code', 'error');
                return;
            }

            log(`Joining with code: ${sessionCode}...`, 'info');

            try {
                const response = await fetch(`http://10.98.52.229:8080/session/code/${sessionCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                log(`✅ Joined session: ${data.session_id}`, 'success');
                log(`📊 Status: ${data.status}`, 'info');
                
                document.getElementById('joinResult').innerHTML = 
                    `<span class="success">✅ Joined successfully as second user!</span>`;
                
            } catch (error) {
                log(`❌ Failed to join: ${error.message}`, 'error');
                document.getElementById('joinResult').innerHTML = 
                    `<span class="error">❌ Join failed: ${error.message}</span>`;
            }
        }

        function connectWebSocket() {
            if (!currentSessionId) {
                log('❌ No session created', 'error');
                return;
            }

            const wsUrl = `ws://10.98.52.229:8080/ws/${currentSessionId}`;
            document.getElementById('wsUrl').value = wsUrl;
            
            log(`🔄 Connecting to ${wsUrl}...`, 'info');
            updateStatus('connecting');

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('✅ WebSocket CONNECTED successfully!', 'success');
                    updateStatus('connected');
                    document.getElementById('closeBtn').disabled = false;
                };

                ws.onmessage = (event) => {
                    log(`📩 Received: ${event.data}`, 'success');
                };

                ws.onerror = (error) => {
                    log('❌ WebSocket ERROR', 'error');
                };

                ws.onclose = (event) => {
                    log(`🔌 WebSocket CLOSED (code: ${event.code})`, 'error');
                    updateStatus('disconnected');
                    document.getElementById('closeBtn').disabled = true;
                };

            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
                updateStatus('disconnected');
            }
        }

        function closeWebSocket() {
            if (ws) {
                ws.close();
            }
        }
    </script>
</body>
</html>
