<!DOCTYPE html>
<html>
<head>
    <title>Driflly WebSocket Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: monospace;
            background: #0A192F;
            color: #E6F1FF;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            background: #64FFDA;
            color: #0A192F;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .log {
            background: #112240;
            border: 1px solid #233554;
            padding: 10px;
            margin: 10px 0;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        .error { color: #ff6b6b; }
        .success { color: #4ADE80; }
        .info { color: #64FFDA; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Debug Test</h1>
        
        <div>
            <button onclick="testWS()">Test WebSocket Connection</button>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script>
        const API_URL = 'http://10.98.52.229:8080';
        const WS_URL = 'ws://10.98.52.229:8080';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = '';
        }

        async function testWS() {
            log('=== Starting WebSocket Test ===', 'info');
            
            try {
                // First create a session
                log('Creating test session...', 'info');
                const response = await fetch(`${API_URL}/session/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });
                
                const session = await response.json();
                log(`✅ Session created: ${session.session_id}`, 'success');
                log(`📝 Session data: ${JSON.stringify(session)}`, 'info');
                
                // Now try WebSocket connection
                const wsUrl = `${WS_URL}/ws/${session.session_id}`;
                log(`🔄 Connecting to: ${wsUrl}`, 'info');
                
                const ws = new WebSocket(wsUrl);
                
                // Connection timeout
                const timeout = setTimeout(() => {
                    log('❌ Connection timeout after 5 seconds', 'error');
                    ws.close();
                }, 5000);
                
                ws.onopen = () => {
                    clearTimeout(timeout);
                    log('✅ WebSocket OPENED successfully', 'success');
                    log('📊 ReadyState: ' + ws.readyState, 'success');
                    
                    // Send a test message
                    ws.send(JSON.stringify({
                        type: 'ping',
                        timestamp: Date.now()
                    }));
                    log('📤 Sent ping message', 'info');
                };
                
                ws.onmessage = (event) => {
                    log(`📩 Received: ${event.data}`, 'success');
                    try {
                        const data = JSON.parse(event.data);
                        log(`📊 Parsed data type: ${data.type}`, 'info');
                    } catch (e) {
                        log(`❌ Failed to parse: ${e.message}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    clearTimeout(timeout);
                    log('❌ WebSocket ERROR event triggered', 'error');
                    log(`🔍 Error details: ${JSON.stringify(error)}`, 'error');
                    
                    // Log WebSocket state
                    log(`📊 WebSocket readyState: ${ws.readyState}`, 'info');
                    log(`📊 WebSocket URL: ${ws.url}`, 'info');
                };
                
                ws.onclose = (event) => {
                    clearTimeout(timeout);
                    log(`🔌 WebSocket CLOSED - Code: ${event.code}, Reason: ${event.reason || 'No reason'}`, 'error');
                    log(`📊 Was clean: ${event.wasClean}`, 'info');
                    
                    // Common WebSocket close codes:
                    // 1000: Normal closure
                    // 1006: Abnormal closure (connection lost)
                    // 1008: Policy violation
                    // 1011: Internal error
                };
                
            } catch (error) {
                log(`❌ Test failed: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
