<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { background: #0A192F; color: #64FFDA; font-family: monospace; padding: 20px; }
        button { background: #64FFDA; color: #0A192F; border: none; padding: 10px 20px; border-radius: 5px; margin: 5px; cursor: pointer; }
        pre { background: #112240; padding: 10px; border-radius: 5px; color: #E6F1FF; }
        .success { color: #4ADE80; }
        .error { color: #F87171; }
    </style>
</head>
<body>
    <h1>🔧 API Connection Test</h1>
    <div>
        <button onclick="testHealth()">Test /health</button>
        <button onclick="testCreate()">Test /session/create</button>
        <button onclick="testOptions()">Test OPTIONS</button>
    </div>
    <pre id="result">Click a button to test...</pre>

    <script>
        const API_URL = 'http://10.98.52.229:8080';
        
        async function testHealth() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            try {
                const response = await fetch(`${API_URL}/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                result.innerHTML = `<span class="success">✅ SUCCESS</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ ERROR</span>\n${error.message}`;
            }
        }

        async function testCreate() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            try {
                const response = await fetch(`${API_URL}/session/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 5 })
                });
                const data = await response.json();
                result.innerHTML = `<span class="success">✅ SUCCESS</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ ERROR</span>\n${error.message}`;
            }
        }

        async function testOptions() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            try {
                const response = await fetch(`${API_URL}/session/create`, {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'http://10.98.52.229:3000',
                        'Access-Control-Request-Method': 'POST'
                    }
                });
                const headers = {};
                response.headers.forEach((value, key) => { headers[key] = value; });
                result.innerHTML = `<span class="success">✅ SUCCESS</span>\nStatus: ${response.status}\nHeaders: ${JSON.stringify(headers, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ ERROR</span>\n${error.message}`;
            }
        }
    </script>
</body>
</html>
