name: Driflly Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-security-tests:
    name: Backend Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run security tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests/test_security/ -v

  frontend-unit-tests:
    name: Frontend Unit Tests (Encryption Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run encryption tests
        run: |
          cd frontend
          npx vitest run src/tests/encryption.test.ts

  frontend-integration-tests:
    name: Frontend Integration Tests (with Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Start backend server
        run: |
          cd backend
          uvicorn app:app --host 0.0.0.0 --port 8080 &
          sleep 5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run API and WebSocket tests
        run: |
          cd frontend
          npx vitest run src/tests/api.test.ts src/tests/websocket.test.ts src/tests/websocket/termination.test.ts

  stress-tests:
    name: Real Server Stress Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start backend server
        run: |
          cd backend
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run real API stress tests
        run: |
          cd backend
          python tests/load/real_api_stress.py

  test-summary:
    name: Test Summary
    needs: [backend-security-tests, frontend-unit-tests, frontend-integration-tests, stress-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Display test results
        run: |
          echo "========================================="
          echo "✅ TEST SUMMARY"
          echo "========================================="
          echo "• Backend Security Tests: Complete"
          echo "• Frontend Unit Tests: Complete"
          echo "• Frontend Integration Tests: Complete"
          echo "• Stress Tests: Complete"
          echo "========================================="
