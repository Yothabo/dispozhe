name: Full Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx requests websockets bandit
          
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/test_security/ -v
          pytest tests/ -v --ignore=tests/load --ignore=tests/expiry --ignore=tests/websocket
          
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Run unit tests
        run: |
          cd frontend
          npm run test:all
          
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Bandit
        run: pip install bandit
        
      - name: Run Bandit
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json || true
          
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high || true
          
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            frontend/npm-audit.json

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          cd ../frontend
          npm ci
          
      - name: Start backend
        run: |
          cd backend
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          
      - name: Start frontend
        run: |
          cd frontend
          npm run build
          npm run preview -- --port 3000 &
          sleep 10
          
      - name: Install Cypress
        run: |
          cd frontend
          npm install cypress --save-dev
          
      - name: Run Cypress E2E tests
        run: |
          cd frontend
          npx cypress run --config video=false || true
          
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

  test-summary:
    needs: [backend-tests, frontend-tests, security-scan, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "✅ Test suite completed!"
          echo "📊 Check individual job statuses above"
