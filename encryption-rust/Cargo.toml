[package]
name = "chatie-encryption"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
wasm-bindgen = "0.2.95"
aes-gcm = "0.10.3"
rand = "0.8.5"
base64 = "0.21.7"
getrandom = { version = "0.2.15", features = ["wasm-bindgen"] }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
